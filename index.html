<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>半导体器件物理 · 刷题</title>
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#F0FAF0;--card:#FFF;--primary:#4CAF50;--primary-dark:#388E3C;--primary-light:#A5D6A7;--text:#2E7D32;--text2:#81C784;--danger:#EF5350;--danger-light:#FFCDD2;--gold:#FFD700;--shadow:0 2px 12px rgba(76,175,80,.15);--r:12px;--border:#ddd;--input-bg:#fff;--card-hover:#F0FFF0;--wrong-bg:#FFF5F5;--option-bg:#FAFFFA;--option-border:#E8F5E9;--option-hover-bg:#F0FFF0;--option-correct-bg:#C8E6C9;--option-correct-text:#1B5E20;--option-wrong-text:#B71C1C;--feedback-correct-bg:#E8F5E9;--fb-formula-bg:#F5FFF5;--ach-bg:#E8F5E9;--easy-hover:#E8F5E9;--medium-hover:#FFF8E1;--wrong-hover-bg:#FFEBEE}[data-theme="night"]{--bg:#121212;--card:#1e1e1e;--primary:#81C784;--primary-dark:#66BB6A;--primary-light:#388E3C;--text:#f0f0f0;--text2:#9e9e9e;--danger:#EF5350;--danger-light:#4A1A1A;--gold:#FFD700;--shadow:0 2px 12px rgba(0,0,0,.4);--border:#444;--input-bg:#2a2a2a;--card-hover:#2a2a2a;--wrong-bg:#3a2020;--option-bg:#2a2a2a;--option-border:#444;--option-hover-bg:#353535;--option-correct-bg:#1B5E20;--option-correct-text:#C8E6C9;--option-wrong-text:#FFCDD2;--feedback-correct-bg:#1a3a1a;--fb-formula-bg:#222;--ach-bg:#2a2a2a;--easy-hover:#1a3a1a;--medium-hover:#3a3a1a;--wrong-hover-bg:#4a2020}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}.top-bar{background:var(--card);padding:12px 20px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:100}.top-bar .logo{font-size:1.3em;font-weight:700;color:var(--primary-dark);margin-right:15px;white-space:nowrap}.top-bar .logo span{color:var(--primary)}.top-bar .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1}.top-bar select,.top-bar input,.top-bar button{padding:6px 12px;border:2px solid var(--border);border-radius:8px;font-size:.9em;background:var(--input-bg);color:var(--text);outline:none;transition:.2s}.top-bar select:focus,.top-bar input:focus{border-color:var(--primary)}.top-bar button{background:var(--primary);color:#fff;border:none;cursor:pointer;font-weight:600}.top-bar button:hover{background:var(--primary-dark);transform:translateY(-1px)}.top-bar button.active{background:var(--primary-dark);box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}.mode-btn{min-width:80px}.search-box{display:flex;align-items:center;gap:4px;position:relative}.search-box input{width:160px}.main{flex:1;max-width:900px;margin:20px auto;padding:0 16px;width:100%}.progress-bar-wrap{background:var(--card);border-radius:var(--r);padding:12px 20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}.progress-bar-wrap .info{display:flex;gap:16px;flex-wrap:wrap;flex:1;font-size:.9em}.progress-bar-wrap .info .stat{display:flex;align-items:center;gap:4px}.progress-bar-wrap .info .stat .num{font-weight:700;color:var(--primary-dark)}.progress-bar{flex:1;min-width:120px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary-light),var(--primary));border-radius:4px;transition:width .4s}.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}.card .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.85em;color:var(--text2)}.card .q-header .q-num{font-weight:700;font-size:1.1em;color:var(--text)}.card .q-text{font-size:1.1em;line-height:1.7;margin-bottom:20px;padding:12px;background:var(--card-hover);border-radius:8px;border-left:4px solid var(--primary)}.options{display:flex;flex-direction:column;gap:8px}.option-btn{display:block;width:100%;text-align:left;padding:12px 16px;border:2px solid var(--option-border);border-radius:8px;background:var(--option-bg);cursor:pointer;font-size:.95em;color:var(--text);transition:.2s;line-height:1.5}.option-btn:hover{border-color:var(--primary-light);background:var(--option-hover-bg)}.option-btn.correct{border-color:var(--primary);background:var(--option-correct-bg);color:var(--option-correct-text)}.option-btn.wrong{border-color:var(--danger);background:var(--danger-light);color:var(--option-wrong-text)}.option-btn.disabled{cursor:default;opacity:.7}.option-btn .label{font-weight:600;margin-right:8px}.feedback{margin-top:16px;padding:16px;border-radius:8px;display:none}.feedback.show{display:block}.feedback.correct{background:var(--feedback-correct-bg);border-left:4px solid var(--primary)}.feedback.wrong{background:var(--danger-light);border-left:4px solid var(--danger)}.feedback .fb-title{font-weight:700;font-size:1.1em;margin-bottom:8px}.feedback .fb-formula{background:var(--fb-formula-bg);padding:8px 12px;border-radius:6px;margin:8px 0;font-family:"Times New Roman",serif;font-style:italic}.feedback .fb-explanation{line-height:1.7;margin-top:8px}.flip-card{perspective:1000px;margin-bottom:16px}.flip-card-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:200px}.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}.flip-card-front,.flip-card-back{position:absolute;width:100%;backface-visibility:hidden;background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}.flip-card-front{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px}.flip-card-front .q-text{width:100%;margin-bottom:20px}.flip-card-front .flip-hint{color:var(--text2);font-size:.9em;cursor:pointer;padding:10px 20px;border:2px dashed var(--primary-light);border-radius:8px;transition:.2s}.flip-card-front .flip-hint:hover{background:var(--card-hover);border-color:var(--primary)}.flip-card-back{transform:rotateY(180deg)}.flip-card-back .answer-label{font-weight:700;color:var(--primary-dark);margin-bottom:12px}.flip-card-back .answer-text{font-size:1em;line-height:1.6;margin-bottom:12px;padding:12px;background:var(--card-hover);border-radius:8px;border-left:4px solid var(--primary)}.flip-card-back .fb-formula{background:var(--fb-formula-bg);padding:8px 12px;border-radius:6px;margin:8px 0;font-style:italic}.flip-card-back .fb-explanation{line-height:1.7;margin-top:8px}.self-eval{margin-top:16px;display:flex;gap:8px;justify-content:center}.self-eval button{padding:8px 16px;border:2px solid var(--border);border-radius:8px;background:var(--input-bg);cursor:pointer;font-size:.9em;transition:.2s}.self-eval button:hover{border-color:var(--primary)}.self-eval button.easy{color:var(--primary-dark)}.self-eval button.easy:hover{background:var(--easy-hover);border-color:var(--primary)}.self-eval button.medium{color:#F57F17}.self-eval button.medium:hover{background:var(--medium-hover);border-color:#F57F17}.self-eval button.hard{color:var(--danger)}.self-eval button.hard:hover{background:var(--danger-light);border-color:var(--danger)}.nav-buttons{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.nav-buttons button{padding:10px 20px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.95em;font-weight:600;cursor:pointer;transition:.2s}.nav-buttons button:hover{background:var(--primary-dark)}.nav-buttons button:disabled{background:var(--border);cursor:not-allowed;color:var(--text2)}

/* ===== 欢迎页 ===== */
.welcome-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;min-height:50vh}.welcome-card .welcome-icon{font-size:4em;margin-bottom:16px}.welcome-card h2{font-size:1.5em;color:var(--primary-dark);margin-bottom:8px}.welcome-card .welcome-desc{color:var(--text2);font-size:.95em;margin-bottom:6px;line-height:1.6}.welcome-card .welcome-info{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0 24px}.welcome-card .welcome-info span{background:var(--card-hover);padding:8px 16px;border-radius:8px;font-size:.9em;color:var(--text)}.welcome-card .welcome-btn{padding:14px 48px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:1.15em;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 4px 16px rgba(76,175,80,.3)}.welcome-card .welcome-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(76,175,80,.4)}.panel-toggle{position:fixed;right:16px;bottom:80px;z-index:90;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.2em;cursor:pointer;box-shadow:0 4px 12px rgba(76,175,80,.3);transition:.2s}.panel-toggle:hover{transform:scale(1.1)}.side-panel{position:fixed;right:-380px;top:0;width:360px;height:100vh;background:var(--card);box-shadow:-4px 0 20px rgba(0,0,0,.1);z-index:200;transition:right .3s;overflow-y:auto;padding:20px 20px 80px}.side-panel.open{right:0}.side-panel .close-panel{float:right;background:none;border:none;font-size:1.5em;cursor:pointer;color:var(--text)}.side-panel h3{margin-bottom:12px;color:var(--primary-dark);border-bottom:2px solid var(--bg);padding-bottom:8px}.side-panel .panel-section{margin-bottom:20px}.calendar{width:100%;border-collapse:collapse}.calendar th,.calendar td{text-align:center;padding:6px;font-size:.85em}.calendar th{color:var(--text2);font-weight:600}.calendar td{border-radius:4px}.calendar td.learned{background:var(--primary-light);color:var(--option-correct-text);font-weight:700}.calendar td.today{border:2px solid var(--primary)}.calendar td.empty{color:#ddd}.summary-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg)}.summary-item .label{color:var(--text2)}.summary-item .value{font-weight:600}.wrong-list{list-style:none}.wrong-list li{padding:8px;margin-bottom:6px;background:var(--wrong-bg);border-radius:6px;cursor:pointer;font-size:.9em;border-left:3px solid var(--danger);transition:.2s}.wrong-list li:hover{background:var(--wrong-hover-bg)}.gamification{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.gamification .xp-bar{flex:1;min-width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}.gamification .xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),#FF8F00);border-radius:3px;transition:width .4s}.gamification .level-badge{background:var(--gold);color:#5D4037;padding:2px 10px;border-radius:12px;font-weight:700;font-size:.8em}.achievements{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.achievements .ach{padding:4px 10px;border-radius:12px;font-size:.8em;background:var(--ach-bg);border:1px solid var(--primary-light)}.achievements .ach.locked{background:var(--bg);color:var(--text2);opacity:.5}.search-results{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);max-height:300px;overflow-y:auto;z-index:50;display:none}.search-results.show{display:block}.search-results .sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.9em}.search-results .sr-item:hover{background:var(--card-hover)}.search-results .sr-item .sr-num{color:var(--text2);margin-right:8px}.search-results .sr-item .sr-chapter{font-size:.8em;color:var(--text2);margin-left:8px}.search-results .sr-item mark{background:#FFF9C4}/* ===== 设置面板 ===== */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center}.settings-overlay.open{display:flex}.settings-panel{background:var(--card);border-radius:var(--r);width:90%;max-width:420px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2);animation:fadeIn .25s}.settings-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eee}.settings-header h3{margin:0}.settings-header .close-btn{background:none;border:none;font-size:1.4em;cursor:pointer;color:var(--text)}.settings-body{padding:16px 20px 20px}.setting-group{margin-bottom:18px}.setting-label{display:block;font-weight:600;margin-bottom:6px;font-size:.9em;color:var(--text)}.setting-group select{width:100%;padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:.95em;background:#fff;color:var(--text);outline:none}.setting-group select:focus{border-color:var(--primary)}.settings-action-btn{display:block;width:100%;padding:10px;margin-bottom:8px;border:2px solid var(--primary-light);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:.95em;cursor:pointer;transition:.2s;text-align:center}.settings-action-btn:hover{background:var(--card-hover);border-color:var(--primary)}

/* ===== 顶栏改造 ===== */
.top-bar-row{display:flex;align-items:center;gap:8px;width:100%}.menu-toggle{display:none;background:none;border:none;font-size:1.4em;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:6px}.menu-toggle:hover{background:var(--bg)}.icon-btn{background:none;border:none;font-size:1.2em;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:6px;transition:.2s}.icon-btn:hover{background:var(--bg)}.settings-btn{margin-left:auto}

@media(max-width:640px){
  .menu-toggle{display:block}
  .top-bar{flex-direction:column;align-items:stretch;padding:8px 12px}
  .top-bar .controls{flex-direction:column;display:none;margin-top:8px;padding-top:8px;border-top:1px solid #eee}
  .top-bar .controls.open{display:flex}
  .top-bar .search-box input{width:100%}
  .top-bar .logo{font-size:1.1em}
  .side-panel{width:100%;right:-100%}
  .main{padding:0 12px;margin:12px auto}
  .card{padding:16px}
  .progress-bar-wrap{flex-direction:column}
  .mode-btn{width:100%;text-align:center}
}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .3s}@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-200px) rotate(720deg);opacity:0}}.confetti-piece{position:fixed;width:10px;height:10px;z-index:999;animation:confetti 1.5s forwards;pointer-events:none}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:.9em;z-index:999;opacity:0;transition:opacity .3s}.toast.show{opacity:1}</style></head><body>
<div class="top-bar">
  <div class="top-bar-row">
    <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" aria-label="展开菜单">☰</button>
    <div class="logo">📘 <span>半导体器件物理</span> · 刷题</div>
    <button class="icon-btn settings-btn" onclick="toggleSettings()" aria-label="设置">⚙️</button>
  </div>
  <div class="controls" id="topControls">
    <button class="mode-btn active" data-mode="choice" onclick="setMode('choice')">📝 选择题</button>
    <button class="mode-btn" data-mode="flip" onclick="setMode('flip')">🔄 卡片翻转</button>
    <select id="chapterFilter" onchange="applyFilters()">
      <option value="0">📂 全部章节</option>
    </select>
    <select id="modeFilter" onchange="applyFilters()">
      <option value="sequential">📋 顺序刷题</option>
      <option value="random">🎲 随机抽题</option>
      <option value="wrong">📕 错题优先</option>
    </select>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 搜索题目..." oninput="onSearch()">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="info">
    <span class="stat">📊 进度 <span class="num" id="progressNum">0/300</span></span>
    <span class="stat">✅ 正确 <span class="num" id="correctNum">0</span></span>
    <span class="stat">📈 正确率 <span class="num" id="rateNum">0%</span></span>
    <span class="stat gamification">
      <span class="level-badge" id="levelBadge">Lv.1</span>
      <div class="xp-bar"><div class="fill" id="xpFill" style="width:0%"></div></div>
      <span id="xpText" style="font-size:.85em">0 XP</span>
    </span>
  </div>
  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="main" id="mainContent">
  <div class="card welcome-card fade-in" id="welcomeCard">
    <div class="welcome-icon">📘</div>
    <h2>半导体器件物理</h2>
    <p class="welcome-desc">欢迎回来，萧安！今天也要加油学习哦 💪</p>
    <div class="welcome-info">
      <span id="welcomeTotal">📚 题库加载中...</span>
      <span id="welcomeChapter">📂 全部章节</span>
    </div>
    <button class="welcome-btn" onclick="startLearning()">🎯 开始学习</button>
  </div>
  <div class="card fade-in" id="questionCard" style="display:none">
    <div class="q-header">
      <span class="q-num" id="qNum">第 1 题</span>
      <span id="qChapter" style="color:var(--text2)">加载中...</span>
    </div>
    <div class="q-text" id="qText">加载题库中...</div>
    
    <div id="choiceArea">
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fbTitle"></div>
        <div class="fb-formula" id="fbFormula"></div>
        <div class="fb-explanation" id="fbExplanation"></div>
      </div>
    </div>
    
    <div id="flipArea" style="display:none">
      <div class="flip-card" id="flipCard">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <div class="q-text" id="flipQText"></div>
            <div class="flip-hint" onclick="flipCard()">🤔 点击翻转 · 查看答案</div>
          </div>
          <div class="flip-card-back">
            <div class="answer-label">📌 答案要点</div>
            <div class="answer-text" id="flipAnswer"></div>
            <div class="fb-formula" id="flipFormula"></div>
            <div class="fb-explanation" id="flipExplanation"></div>
            <div class="self-eval">
              <span style="font-size:.85em;color:var(--text2);margin-right:4px">自评：</span>
              <button class="easy" onclick="selfEval('easy')">😊 会了</button>
              <button class="medium" onclick="selfEval('medium')">🤔 模糊</button>
              <button class="hard" onclick="selfEval('hard')">😵 不会</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="nav-buttons">
      <button id="prevBtn" onclick="navigate(-1)">◀ 上一题</button>
      <button id="nextBtn" onclick="navigate(1)">下一题 ▶</button>
    </div>
  </div>
</div>

<button class="panel-toggle" onclick="togglePanel()" title="学习统计">📊</button>

<div class="side-panel" id="sidePanel">
  <button class="close-panel" onclick="togglePanel()">✕</button>
  <div class="panel-section">
    <h3>📅 学习日历</h3>
    <div id="calendarContainer"></div>
  </div>
  <div class="panel-section">
    <h3>📋 今日总结</h3>
    <div id="todaySummary">
      <div class="summary-item"><span class="label">答题</span><span class="value" id="sTodayCount">0 题</span></div>
      <div class="summary-item"><span class="label">正确</span><span class="value" id="sTodayCorrect">0 题</span></div>
      <div class="summary-item"><span class="label">正确率</span><span class="value" id="sTodayRate">0%</span></div>
      <div class="summary-item"><span class="label">新增错题</span><span class="value" id="sTodayWrong">0 题</span></div>
      <div class="summary-item"><span class="label">学习时长</span><span class="value" id="sTodayTime">0 分钟</span></div>
    </div>
  </div>
  <div class="panel-section">
    <h3>🏆 成就</h3>
    <div class="achievements" id="achievementList"></div>
  </div>
  <div class="panel-section">
    <h3>📕 错题本 (<span id="wrongCount">0</span>)</h3>
    <ul class="wrong-list" id="wrongList">
      <li style="color:var(--text2);text-align:center;padding:20px">暂无错题，继续加油！</li>
    </ul>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()">
  <div class="settings-panel" onclick="event.stopPropagation()">
    <div class="settings-header">
      <h3>⚙️ 设置</h3>
      <button class="close-btn" onclick="toggleSettings()">✕</button>
    </div>
    <div class="settings-body">
      <div class="setting-group">
        <label class="setting-label">📂 章节筛选</label>
        <select id="chapterFilterSettings" onchange="applyFilterFromSettings()"></select>
      </div>
      <div class="setting-group">
        <label class="setting-label">📋 刷题模式</label>
        <select id="modeFilterSettings" onchange="applyFilterFromSettings()">
          <option value="sequential">顺序刷题</option>
          <option value="random">随机抽题</option>
          <option value="wrong">错题优先</option>
        </select>
      </div>
      <div class="setting-group">
        <label class="setting-label">🎨 主题模式</label>
        <select id="themeSelect" onchange="setTheme(this.value)">
          <option value="day">☀️ 白天模式</option>
          <option value="night">🌙 夜晚护眼模式</option>
        </select>
      </div>
      <div class="setting-group">
        <label class="setting-label">📊 数据管理</label>
        <button class="settings-action-btn" onclick="exportData()">📤 导出学习数据</button>
        <button class="settings-action-btn" onclick="document.getElementById('importInput').click()">📥 导入学习数据</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
        <p style="font-size:.8em;color:var(--text2);margin-top:8px">导出后换设备或重装时可导入恢复数据</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

let questions = [];
let currentIndex = 0;
let currentIds = [];
let mode = 'choice';
let answered = {};
let wrongSet = new Set();
let xp = 0;
let level = 1;
let achievements = {};
let studyLog = {};
let sessionStart = Date.now();
let todayStr = '';
let started = false;
let currentTheme = 'day';

function init() {
  loadData();
  loadTheme();
  fetch('questions.json')
    .then(r => r.json())
    .then(data => {
      questions = data;
      document.getElementById('qText').textContent = '题库加载完成！';
      buildChapterFilter();
      applyFilters();
      renderCalendar();
      updateTodaySummary();
      updateAchievements();
      updateStats();
      checkIn();
      showWelcome();
    })
    .catch(err => {
      document.getElementById('qText').textContent = '⚠️ 题库加载失败，请检查 questions.json 是否存在。';
      console.error(err);
    });
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem('semiquiz_data'));
    if (saved) {
      answered = saved.answered || {};
      wrongSet = new Set(saved.wrongList || []);
      xp = saved.xp || 0;
      level = saved.level || 1;
      achievements = saved.achievements || {};
      studyLog = saved.studyLog || {};
    }
  } catch(e) { console.warn('Load error', e); }
  todayStr = getTodayStr();
}

function saveData() {
  try {
    localStorage.setItem('semiquiz_data', JSON.stringify({
      answered,
      wrongList: [...wrongSet],
      xp,
      level,
      achievements,
      studyLog
    }));
  } catch(e) { console.warn('Save error', e); }
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function checkIn() {
  if (!studyLog[todayStr]) {
    studyLog[todayStr] = { count: 0, correct: 0, wrong: 0, time: 0 };
  }
  saveData();
}

function buildChapterFilter() {
  const sel = document.getElementById('chapterFilter');
  const chNames = {1:'半导体物理基础与晶体结构',2:'载流子统计与热平衡',3:'载流子输运、复合与连续性方程',4:'PN 结基础与结特性',5:'金属-半导体接触与肖特基器件',6:'双极型晶体管与结型器件',7:'MOS 电容与表面物理',8:'MOSFET 工作原理与电流模型',9:'先进 MOSFET、短沟道与可靠性',10:'光电子器件与太阳能电池',11:'功率器件、高频器件与异质结器件',12:'工艺、表征与综合分析'};
  const chapters = new Set(questions.map(q => q.chapter));
  [...chapters].sort((a,b) => a-b).forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = '第' + ch + '章 · ' + (chNames[ch] || '');
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const ch = parseInt(document.getElementById('chapterFilter').value);
  const modeF = document.getElementById('modeFilter').value;
  let filtered = questions.filter(q => ch === 0 || q.chapter === ch);
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  if (searchTerm) {
    filtered = filtered.filter(q =>
      q.question_text.toLowerCase().includes(searchTerm) ||
      q.explanation.toLowerCase().includes(searchTerm) ||
      q.formula.toLowerCase().includes(searchTerm) ||
      (q.tags && q.tags.some(t => t.toLowerCase().includes(searchTerm)))
    );
  }
  if (modeF === 'wrong') {
    const wrongIds = [...wrongSet];
    filtered = filtered.filter(q => wrongIds.includes(q.id));
    filtered.sort((a, b) => {
      const aCnt = answered[a.id] ? (answered[a.id].wrongCount || 0) : 0;
      const bCnt = answered[b.id] ? (answered[b.id].wrongCount || 0) : 0;
      return bCnt - aCnt;
    });
  } else if (modeF === 'random') {
    filtered = [...filtered];
    for (let i = filtered.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
    }
  }
  currentIds = filtered.map(q => q.id);
  currentIndex = 0;
  if (currentIds.length === 0) {
    document.getElementById('qText').textContent = '😅 没有符合条件的题目';
    document.getElementById('optionsContainer').innerHTML = '';
    return;
  }
  if (started) {
    showQuestion(currentIndex);
  } else {
    showWelcome();
  }
  updateStats();
}

let searchTimer = null;
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    applyFilters();
    showSearchDropdown();
  }, 300);
}

function showSearchDropdown() {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  const term = input.value.trim().toLowerCase();
  if (!term) { results.classList.remove('show'); return; }
  const matched = questions.filter(q =>
    q.question_text.toLowerCase().includes(term) ||
    q.explanation.toLowerCase().includes(term)
  ).slice(0, 10);
  if (matched.length === 0) { results.classList.remove('show'); return; }
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\$&');
  results.innerHTML = matched.map(q => {
    const hl = q.question_text.replace(new RegExp(escaped, 'gi'), m => '<mark>' + m + '</mark>');
    return '<div class="sr-item" onclick="goToQuestion(' + q.id + ')"><span class="sr-num">#' + q.id + '</span>' + hl + '<span class="sr-chapter">第' + q.chapter + '章</span></div>';
  }).join('');
  results.classList.add('show');
}

document.addEventListener('click', function(e) {
  const box = document.querySelector('.search-box');
  if (box && !box.contains(e.target)) {
    document.getElementById('searchResults').classList.remove('show');
  }
});

function goToQuestion(id) {
  const idx = currentIds.indexOf(id);
  if (idx !== -1) {
    currentIndex = idx;
    showQuestion(currentIndex);
  }
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.remove('show');
}

function showQuestion(index) {
  if (!currentIds.length) return;
  const id = currentIds[index];
  const q = questions.find(x => x.id === id);
  if (!q) return;
  document.getElementById('qNum').textContent = '第 ' + (index + 1) + ' / ' + currentIds.length + ' 题';
  document.getElementById('qChapter').textContent = q.chapter_name;
  document.getElementById('qText').textContent = q.question_text;
  if (mode === 'choice') {
    document.getElementById('choiceArea').style.display = 'block';
    document.getElementById('flipArea').style.display = 'none';
    renderOptions(q);
  } else {
    document.getElementById('choiceArea').style.display = 'none';
    document.getElementById('flipArea').style.display = 'block';
    renderFlip(q);
  }
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index >= currentIds.length - 1;
  updateStats();
}

function renderOptions(q) {
  const container = document.getElementById('optionsContainer');
  const feedback = document.getElementById('feedback');
  feedback.classList.remove('show', 'correct', 'wrong');
  const labels = ['A', 'B', 'C', 'D'];
  const answeredInfo = answered[q.id];
  container.innerHTML = q.options.map((opt, idx) => {
    let cls = 'option-btn';
    let disabled = '';
    if (answeredInfo) {
      disabled = 'disabled';
      if (idx === q.correct) cls += ' correct';
      else if (idx === answeredInfo.selected) cls += ' wrong';
      else cls += ' disabled';
    }
    return '<button class="' + cls + '" ' + disabled + ' onclick="selectOption(' + q.id + ',' + idx + ')"><span class="label">' + labels[idx] + '.</span>' + escapeHtml(opt) + '</button>';
  }).join('');
  if (answeredInfo && answeredInfo.selected !== undefined) {
    showFeedback(q, answeredInfo.selected === q.correct);
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function selectOption(qId, selectedIdx) {
  const q = questions.find(x => x.id === qId);
  if (!q || answered[qId]) return;
  const isCorrect = selectedIdx === q.correct;
  answered[qId] = {
    selected: selectedIdx,
    correct: isCorrect,
    timestamp: Date.now(),
    wrongCount: answered[qId] ? (answered[qId].wrongCount || 0) : 0
  };
  if (!isCorrect) {
    answered[qId].wrongCount = (answered[qId].wrongCount || 0) + 1;
    wrongSet.add(qId);
  }
  logStudy(isCorrect);
  addXP(isCorrect ? 10 : 2);
  renderOptions(q);
  updateStats();
  saveData();
  if (isCorrect) {
    showToast('✅ 回答正确！+10 XP');
    if (Math.random() < 0.1) spawnConfetti();
  } else {
    showToast('❌ 答错了，看看解析吧 +2 XP');
  }
}

function showFeedback(q, isCorrect) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  document.getElementById('fbTitle').textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
  document.getElementById('fbFormula').textContent = '📐 ' + q.formula;
  document.getElementById('fbExplanation').textContent = '📖 ' + q.explanation;
}

function renderFlip(q) {
  const card = document.getElementById('flipCard');
  card.classList.remove('flipped');
  document.getElementById('flipQText').textContent = q.question_text;
  document.getElementById('flipAnswer').textContent = q.short_answer;
  document.getElementById('flipFormula').textContent = '📐 ' + q.formula;
  document.getElementById('flipExplanation').textContent = '📖 ' + q.explanation;
}

function flipCard() {
  const card = document.getElementById('flipCard');
  card.classList.toggle('flipped');
  if (card.classList.contains('flipped')) addXP(1);
}

function selfEval(level) {
  if (!currentIds.length) return;
  const qId = currentIds[currentIndex];
  if (!answered[qId]) {
    answered[qId] = { selfEval: level, timestamp: Date.now(), wrongCount: 0 };
  } else {
    answered[qId].selfEval = level;
  }
  if (level === 'hard') { wrongSet.add(qId); answered[qId].correct = false; }
  else if (level === 'easy') { answered[qId].correct = true; }
  const xpGain = level === 'easy' ? 5 : level === 'medium' ? 3 : 1;
  addXP(xpGain);
  logStudy(level !== 'hard');
  saveData();
  updateStats();
  const msgs = { easy: '😊 已掌握！+5 XP', medium: '🤔 继续加油！+3 XP', hard: '😵 标记为不会，已加入错题本 +1 XP' };
  showToast(msgs[level]);
}

function navigate(dir) {
  const newIdx = currentIndex + dir;
  if (newIdx < 0 || newIdx >= currentIds.length) return;
  currentIndex = newIdx;
  showQuestion(currentIndex);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (currentIds.length) showQuestion(currentIndex);
}

function logStudy(isCorrect) {
  if (!studyLog[todayStr]) studyLog[todayStr] = { count: 0, correct: 0, wrong: 0, time: 0 };
  studyLog[todayStr].count++;
  if (isCorrect) studyLog[todayStr].correct++;
  else studyLog[todayStr].wrong++;
  saveData();
  updateTodaySummary();
}

function addXP(amount) {
  xp += amount;
  const newLevel = Math.floor(Math.sqrt(xp / 50)) + 1;
  if (newLevel > level) {
    level = newLevel;
    showToast('🎉 升级！达到 Lv.' + level);
    spawnConfetti();
  }
  level = newLevel;
  updateXPBar();
  saveData();
}

function updateXPBar() {
  const xpForNext = level * level * 50;
  const xpForCurrent = (level - 1) * (level - 1) * 50;
  const progress = (xp - xpForCurrent) / (xpForNext - xpForCurrent) * 100;
  document.getElementById('xpFill').style.width = Math.min(100, Math.max(0, progress)) + '%';
  document.getElementById('xpText').textContent = xp + ' XP';
  document.getElementById('levelBadge').textContent = 'Lv.' + level;
}

function updateStats() {
  const total = currentIds.length;
  const done = currentIds.filter(id => answered[id] && (answered[id].correct !== undefined || answered[id].selfEval)).length;
  const correct = currentIds.filter(id => answered[id] && answered[id].correct === true).length;
  const rate = done > 0 ? Math.round(correct / done * 100) : 0;
  document.getElementById('progressNum').textContent = done + ' / ' + total;
  document.getElementById('correctNum').textContent = correct;
  document.getElementById('rateNum').textContent = rate + '%';
  document.getElementById('progressFill').style.width = (total > 0 ? done / total * 100 : 0) + '%';
  document.getElementById('wrongCount').textContent = wrongSet.size;
  updateWrongList();
  updateXPBar();
  updateAchievements();
}

function updateWrongList() {
  const list = document.getElementById('wrongList');
  const wrongIds = [...wrongSet];
  if (wrongIds.length === 0) {
    list.innerHTML = '<li style="color:var(--text2);text-align:center;padding:20px">🎉 暂无错题，太棒了！</li>';
    return;
  }
  list.innerHTML = wrongIds.slice(0, 30).map(id => {
    const q = questions.find(x => x.id === id);
    if (!q) return '';
    return '<li onclick="goToQuestion(' + id + ')">#' + id + ' ' + q.question_text.slice(0, 40) + '...</li>';
  }).join('');
  if (wrongIds.length > 30) {
    list.innerHTML += '<li style="text-align:center;color:var(--text2)">还有更多...</li>';
  }
}

function renderCalendar() {
  const container = document.getElementById('calendarContainer');
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let html = '<div style="text-align:center;font-weight:700;margin-bottom:8px">' + year + '年 ' + monthNames[month] + '</div>';
  html += '<table class="calendar"><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr><tr>';
  for (let i = 0; i < firstDay; i++) html += '<td class="empty"></td>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const isToday = dateStr === todayStr;
    const hasStudy = studyLog[dateStr] && studyLog[dateStr].count > 0;
    let cls = '';
    if (hasStudy) cls += ' learned';
    if (isToday) cls += ' today';
    html += '<td class="' + cls + '">' + day + '</td>';
    if ((firstDay + day) % 7 === 0) html += '</tr><tr>';
  }
  html += '</tr></table>';
  const studyDays = Object.keys(studyLog).filter(d => studyLog[d].count > 0).length;
  const streak = calcStreak();
  html += '<div style="text-align:center;margin-top:8px;font-size:.85em;color:var(--text2)">📆 本月学习 ' + studyDays + ' 天 · 连续 ' + streak + ' 天</div>';
  container.innerHTML = html;
}

function calcStreak() {
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (studyLog[ds] && studyLog[ds].count > 0) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

function updateTodaySummary() {
  const today = studyLog[todayStr] || { count: 0, correct: 0, wrong: 0, time: 0 };
  document.getElementById('sTodayCount').textContent = today.count + ' 题';
  document.getElementById('sTodayCorrect').textContent = today.correct + ' 题';
  const rate = today.count > 0 ? Math.round(today.correct / today.count * 100) : 0;
  document.getElementById('sTodayRate').textContent = rate + '%';
  document.getElementById('sTodayWrong').textContent = today.wrong + ' 题';
  const elapsed = Math.floor((Date.now() - sessionStart) / 60000);
  const totalTime = (today.time || 0) + elapsed;
  document.getElementById('sTodayTime').textContent = totalTime + ' 分钟';
  renderCalendar();
}

setInterval(updateTodaySummary, 60000);

function updateAchievements() {
  const list = document.getElementById('achievementList');
  const totalAnswered = Object.keys(answered).length;
  const totalCorrect = Object.values(answered).filter(a => a.correct === true).length;
  const streak = calcStreak();
  const allAch = [
    { id: 'first', name: '🎯 初出茅庐', check: () => totalAnswered >= 1 },
    { id: 'ten', name: '💪 小试牛刀', check: () => totalAnswered >= 10 },
    { id: 'fifty', name: '🔥 渐入佳境', check: () => totalAnswered >= 50 },
    { id: 'hundred', name: '⚡ 百题斩', check: () => totalAnswered >= 100 },
    { id: 'all', name: '👑 满腹经纶', check: () => totalAnswered >= 300 },
    { id: 'streak3', name: '📆 三日不辍', check: () => streak >= 3 },
    { id: 'streak7', name: '📆 持之以恒', check: () => streak >= 7 },
    { id: 'perfect', name: '🌟 完美无缺', check: () => totalCorrect >= 10 && Math.abs(totalCorrect / (totalAnswered || 1) - 1) < 0.01 },
    { id: 'level5', name: '🌈 Lv.5 达人', check: () => level >= 5 },
    { id: 'level10', name: '🏅 Lv.10 大师', check: () => level >= 10 },
  ];
  allAch.forEach(ach => {
    if (!achievements[ach.id] && ach.check()) {
      achievements[ach.id] = Date.now();
      showToast('🏆 解锁成就：' + ach.name);
      spawnConfetti();
    }
  });
  list.innerHTML = allAch.map(ach => {
    const unlocked = !!achievements[ach.id];
    return '<span class="ach ' + (unlocked ? '' : 'locked') + '">' + (unlocked ? ach.name : '🔒 ???') + '</span>';
  }).join('');
  saveData();
}

function togglePanel() {
  document.getElementById('sidePanel').classList.toggle('open');
  updateTodaySummary();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function spawnConfetti() {
  const colors = ['#4CAF50','#FFD700','#FF5722','#2196F3','#E91E63','#9C27B0'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = Math.random() * 50 + 20 + 'vh';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (Math.random() * 8 + 4) + 'px';
    el.style.height = (Math.random() * 8 + 4) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (Math.random() * 1 + 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function showWelcome() {
  document.getElementById('welcomeCard').style.display = 'flex';
  document.getElementById('questionCard').style.display = 'none';
  started = false;
  const q = questions;
  document.getElementById('welcomeTotal').textContent = '📚 ' + q.length + ' 道题目';
  const ch = parseInt(document.getElementById('chapterFilter').value);
  const chNames = {1:'半导体物理基础',2:'载流子统计',3:'载流子输运',4:'PN 结',5:'肖特基接触',6:'BJT',7:'MOS 电容',8:'MOSFET',9:'先进 MOSFET',10:'光电子',11:'功率器件',12:'工艺表征'};
  document.getElementById('welcomeChapter').textContent = ch === 0 ? '📂 全部章节' : '📂 第' + ch + '章 ' + (chNames[ch] || '');
}

function startLearning() {
  started = true;
  document.getElementById('welcomeCard').style.display = 'none';
  document.getElementById('questionCard').style.display = 'block';
  if (currentIds.length > 0) showQuestion(0);
}

function applyFilterFromSettings() {
  document.getElementById('chapterFilter').value = document.getElementById('chapterFilterSettings').value;
  document.getElementById('modeFilter').value = document.getElementById('modeFilterSettings').value;
  applyFilters();
  if (!started) showWelcome();
}

function setTheme(theme) {
  currentTheme = theme;
  if (theme === 'night') {
    document.documentElement.setAttribute('data-theme', 'night');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('semiquiz_theme', theme);
  const sel = document.getElementById('themeSelect');
  if (sel) sel.value = theme;
}

function loadTheme() {
  const saved = localStorage.getItem('semiquiz_theme');
  if (saved) setTheme(saved);
}

function toggleMenu() {
  const controls = document.getElementById('topControls');
  const toggle = document.getElementById('menuToggle');
  controls.classList.toggle('open');
  toggle.textContent = controls.classList.contains('open') ? '✕' : '☰';
}

function toggleSettings() {
  const overlay = document.getElementById('settingsOverlay');
  overlay.classList.toggle('open');
  if (overlay.classList.contains('open')) {
    populateSettingsFilters();
  }
}

function populateSettingsFilters() {
  const mainFilter = document.getElementById('chapterFilter');
  const settingsFilter = document.getElementById('chapterFilterSettings');
  settingsFilter.innerHTML = mainFilter.innerHTML;
  settingsFilter.value = mainFilter.value;
  document.getElementById('modeFilterSettings').value = document.getElementById('modeFilter').value;
  document.getElementById('themeSelect').value = currentTheme;
}

function exportData() {
  try {
    const data = localStorage.getItem('semiquiz_data');
    if (!data) { showToast('⚠️ 没有可导出的数据'); return; }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const today = new Date().toISOString().slice(0, 10);
    a.download = '半导体物理_学习数据_' + today + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ 数据导出成功');
  } catch(e) { showToast('⚠️ 导出失败：' + e.message); }
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      localStorage.setItem('semiquiz_data', JSON.stringify(data));
      location.reload();
    } catch(err) { showToast('⚠️ 文件格式错误，请选择正确的备份文件'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'f' || e.key === 'F') flipCard();
  else if (e.key === '1') { const btns = document.querySelectorAll('.option-btn:not(.disabled)'); if (btns[0]) btns[0].click(); }
  else if (e.key === '2') { const btns = document.querySelectorAll('.option-btn:not(.disabled)'); if (btns[1]) btns[1].click(); }
  else if (e.key === '3') { const btns = document.querySelectorAll('.option-btn:not(.disabled)'); if (btns[2]) btns[2].click(); }
  else if (e.key === '4') { const btns = document.querySelectorAll('.option-btn:not(.disabled)'); if (btns[3]) btns[3].click(); }
});

init();

</script>
